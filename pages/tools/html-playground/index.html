<div style="height:32px">
    HTML Playground &nbsp; <button onclick="insertHTML(true);">Go!</button>
    <input type="checkbox" id="autoCheck" checked><label for="autoCheck">Auto</label>
    <button onclick="document.getElementById('html-iframe').requestFullscreen();"> Fullscreen </button>
</div>
<div style="display:flex;height:calc(100% - 32px);width: 100%;">
    <div style="display:grid;grid-template-rows:32px 1fr;width:512px;" id="left">
        <div>Input</div>
        <textarea id="html-input" oninput="insertHTML()" style="height:100%;resize:none;">Hello, world!</textarea>
    </div>
    <div style="background-color: black;width: 4px;border:4px solid white;height: calc(100% - 8px);cursor: col-resize;"
        id="center"></div>
    <div style="display:grid;grid-template-rows:32px 1fr;flex: 1;" id="right">
        <div>Output</div>
        <div style="height:100%;">
            <iframe allow="fullscreen" id="html-iframe" style="height:100%;resize:none;"></iframe>
        </div>
    </div>
</div>
<script>
    function insertHTML(manual) {
        if (manual || document.getElementById("autoCheck").checked) {
            output = document.getElementById("html-iframe")
            output.srcdoc = document.getElementById("html-input").value;
        }
    }
    document.getElementById("html-input").value = (
        `<html>
<head>
  <style>
    body {
      color: black;
      background-color:white;
    }
  </style>
</head>
<body>
  Hello, world! 
  <br>
  This page has been updated to support fullscreening the content.
  <br>
  Look above and find the "fullscreen" button to try!
<body>
</html>`)
    insertHTML(document.getElementById("html-input").value)

    bar = document.getElementById("center");
    left = document.getElementById("left");
    mouse_is_down = false;

    bar.addEventListener('mousedown', (e) => {
        mouse_is_down = true;
    })

    document.addEventListener('mousemove', (e) => {
        if (!mouse_is_down) return;
        document.getElementById('__main').style.userSelect = 'none';
        document.getElementById('__main').style.webkitUserSelect = 'none';
        document.getElementById("html-iframe").style.pointerEvents = "none";
        left.style.width = Math.max((e.clientX - left.getBoundingClientRect().left), 64) + "px";
    })

    document.addEventListener('mouseup', () => {
        if (mouse_is_down) {
            document.getElementById('__main').style.userSelect = 'auto';
            document.getElementById('__main').style.webkitUserSelect = 'auto';
            mouse_is_down = false;
            document.getElementById("html-iframe").style.pointerEvents = "auto";
        }
    })
</script>
